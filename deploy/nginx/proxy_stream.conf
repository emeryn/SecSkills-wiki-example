proxy_pass http://backend:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwritten, not appended: this proxy is the trust anchor for the client IP.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-ID $request_id;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_connect_timeout 5s;
# Answers stream token by token: buffering would deliver them all at once at the end.
proxy_buffering off;
proxy_cache off;
# CPU inference can be slow; the backend closes the upstream request when the client leaves.
proxy_read_timeout 300s;
